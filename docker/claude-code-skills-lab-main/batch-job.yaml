apiVersion: batch/v1
kind: Job
metadata:
  name: data-processor
  labels:
    app: batch-processor
spec:
  completions: 5           # Total number of successful completions needed
  parallelism: 2           # Run 2 pods at a time
  backoffLimit: 3          # Retry failed pods up to 3 times
  activeDeadlineSeconds: 600  # Timeout after 10 minutes
  ttlSecondsAfterFinished: 300  # Auto-delete Job 5 min after completion
  template:
    metadata:
      labels:
        app: batch-processor
    spec:
      restartPolicy: OnFailure  # Required: Never or OnFailure for Jobs
      containers:
      - name: processor
        image: python:3.11-slim
        command: ["python", "-c"]
        args:
          - |
            import os
            import time
            import random

            pod_name = os.environ.get('POD_NAME', 'unknown')
            job_index = os.environ.get('JOB_COMPLETION_INDEX', '0')

            print(f"Processing batch {job_index} on {pod_name}")
            time.sleep(random.randint(5, 15))  # Simulate work
            print(f"Batch {job_index} completed successfully")
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: JOB_COMPLETION_INDEX
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
