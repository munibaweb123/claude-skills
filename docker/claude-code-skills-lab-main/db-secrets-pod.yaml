apiVersion: v1
kind: Pod
metadata:
  name: db-secrets-pod
spec:
  containers:
  - name: app
    image: alpine
    command: ["sh", "-c", "ls -la /etc/db-secrets/ && cat /etc/db-secrets/* && sleep 3600"]
    volumeMounts:
    - name: db-secrets-volume
      mountPath: /etc/db-secrets
      readOnly: true
  volumes:
  - name: db-secrets-volume
    secret:
      secretName: db-secrets
      defaultMode: 0400
  restartPolicy: Never
