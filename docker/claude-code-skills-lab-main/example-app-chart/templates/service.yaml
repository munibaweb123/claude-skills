apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "org-standards.labels.common" . | nindent 4 }}
    {{- include "org-standards.labels.selector" . | nindent 4 }}
  annotations:
    {{- include "org-standards.annotations.monitoring" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "org-standards.labels.selector" . | nindent 4 }}
