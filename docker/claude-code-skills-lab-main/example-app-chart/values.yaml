# Example Application Chart Values
# Demonstrates how to configure org-standards library templates

# Application image
image:
  repository: mycompany/example-app
  tag: "1.0.0"
  pullPolicy: IfNotPresent

# Replicas
replicaCount: 3

# Service configuration
service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

# Ingress configuration
ingress:
  enabled: true
  className: nginx
  hosts:
    - host: example-app.company.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: example-app-tls
      hosts:
        - example-app.company.com

# ============================================
# org-standards Library Configuration
# ============================================

# Cost attribution (required for production)
cost:
  center: "engineering"
  businessUnit: "product"
  spotEligible: false

# Environment
environment: production

# Security configuration
security:
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  # Add capabilities if needed (e.g., for binding to privileged ports)
  capabilities: []
  # - NET_BIND_SERVICE

# Resource configuration
resources:
  # Use org-standards preset sizes: micro, small, medium, large, xlarge
  size: medium

  # Or override specific values:
  # limits:
  #   cpu: 1000m
  #   memory: 1Gi
  # requests:
  #   cpu: 500m
  #   memory: 512Mi

# Probe configuration
probes:
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 3

# Health check endpoints
healthCheck:
  liveness: /health
  readiness: /ready

# Observability configuration
metrics:
  enabled: true
  port: 8080
  path: /metrics

tracing:
  enabled: true
  jaeger: true

logging:
  format: json
  level: info

# Common labels (added to all resources)
commonLabels:
  team: backend
  project: example-app
  component: api

# Common annotations (added to all resources)
commonAnnotations:
  description: "Example API application"
  documentation: "https://docs.company.com/example-app"

# Affinity configuration
affinity:
  podAntiAffinity:
    enabled: true
    topologyKey: kubernetes.io/hostname

# Tolerations (for spot instances, GPU nodes, etc.)
tolerations: []
# - key: "spot"
#   operator: "Equal"
#   value: "true"
#   effect: "NoSchedule"

# Autoscaling
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
