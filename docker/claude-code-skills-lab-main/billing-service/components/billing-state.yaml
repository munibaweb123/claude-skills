apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: billing-statestore
  namespace: default
spec:
  type: state.redis
  version: v1
  metadata:
  - name: redisHost
    value: localhost:6379
  - name: redisPassword
    value: ""
  - name: actorStateStore
    value: "false"
  - name: concurrency
    value: parallel
scopes:
- billing-service