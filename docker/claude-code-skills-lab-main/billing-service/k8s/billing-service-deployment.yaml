apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service
  labels:
    app: billing-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: billing-service
  template:
    metadata:
      labels:
        app: billing-service
      annotations:
        # Essential Dapr annotations for service invocation
        dapr.io/enabled: "true"              # Enable Dapr sidecar injection
        dapr.io/app-id: "billing-service"    # Unique app identifier for service invocation
        dapr.io/app-port: "5001"             # Port where billing service listens
        # Optional annotations for enhanced functionality
        dapr.io/config: "app-config"         # Configuration for service invocation policies
        dapr.io/log-as-json: "true"          # Format Dapr logs as JSON for easier parsing
        dapr.io/enable-api-logging: "true"   # Enable detailed API logging for debugging
        dapr.io/log-level: "info"            # Set log level for troubleshooting
    spec:
      containers:
      - name: billing-service
        image: billing-service:latest
        ports:
        - containerPort: 5001
        env:
        - name: PORT
          value: "5001"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 5001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 5001
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: billing-service
spec:
  selector:
    app: billing-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5001
  type: ClusterIP