# Helm Unittest Tests for HorizontalPodAutoscaler

suite: test hpa
templates:
  - hpa.yaml
tests:
  # Test 1: HPA disabled by default
  - it: should not create HPA when disabled
    set:
      autoscaling.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  # Test 2: HPA enabled
  - it: should create HPA when enabled
    set:
      autoscaling.enabled: true
      autoscaling.minReplicas: 2
      autoscaling.maxReplicas: 10
    asserts:
      - isKind:
          of: HorizontalPodAutoscaler
      - hasDocuments:
          count: 1

  # Test 3: HPA metadata
  - it: should have correct name and labels
    set:
      autoscaling.enabled: true
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-task-api
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: task-api

  # Test 4: Scale target reference
  - it: should target the deployment
    set:
      autoscaling.enabled: true
    asserts:
      - equal:
          path: spec.scaleTargetRef.apiVersion
          value: apps/v1
      - equal:
          path: spec.scaleTargetRef.kind
          value: Deployment
      - equal:
          path: spec.scaleTargetRef.name
          value: RELEASE-NAME-task-api

  # Test 5: Min/Max replicas
  - it: should set min and max replicas
    set:
      autoscaling.enabled: true
      autoscaling.minReplicas: 3
      autoscaling.maxReplicas: 20
    asserts:
      - equal:
          path: spec.minReplicas
          value: 3
      - equal:
          path: spec.maxReplicas
          value: 20

  # Test 6: CPU target utilization
  - it: should set CPU target utilization
    set:
      autoscaling.enabled: true
      autoscaling.targetCPUUtilizationPercentage: 70
    asserts:
      - contains:
          path: spec.metrics
          content:
            type: Resource
            resource:
              name: cpu
              target:
                type: Utilization
                averageUtilization: 70

  # Test 7: Memory target utilization
  - it: should set memory target utilization when specified
    set:
      autoscaling.enabled: true
      autoscaling.targetMemoryUtilizationPercentage: 80
    asserts:
      - contains:
          path: spec.metrics
          content:
            type: Resource
            resource:
              name: memory
              target:
                type: Utilization
                averageUtilization: 80

  # Test 8: Both CPU and memory metrics
  - it: should support both CPU and memory metrics
    set:
      autoscaling.enabled: true
      autoscaling.targetCPUUtilizationPercentage: 70
      autoscaling.targetMemoryUtilizationPercentage: 80
    asserts:
      - isNotNull:
          path: spec.metrics
      - lengthEqual:
          path: spec.metrics
          count: 2
