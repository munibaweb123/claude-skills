# Helm Unittest Tests for Ingress

suite: test ingress
templates:
  - ingress.yaml
tests:
  # Test 1: Ingress disabled by default
  - it: should not create ingress when disabled
    set:
      ingress.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  # Test 2: Ingress enabled
  - it: should create ingress when enabled
    set:
      ingress.enabled: true
    asserts:
      - isKind:
          of: Ingress
      - hasDocuments:
          count: 1

  # Test 3: Ingress metadata
  - it: should have correct name and labels
    set:
      ingress.enabled: true
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-task-api
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: task-api

  # Test 4: Ingress class name
  - it: should set ingress class name
    set:
      ingress.enabled: true
      ingress.className: nginx
    asserts:
      - equal:
          path: spec.ingressClassName
          value: nginx

  # Test 5: Ingress annotations
  - it: should include annotations
    set:
      ingress.enabled: true
      ingress.annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        nginx.ingress.kubernetes.io/ssl-redirect: "true"
    asserts:
      - equal:
          path: metadata.annotations["cert-manager.io/cluster-issuer"]
          value: letsencrypt-prod
      - equal:
          path: metadata.annotations["nginx.ingress.kubernetes.io/ssl-redirect"]
          value: "true"

  # Test 6: Ingress hosts
  - it: should configure hosts correctly
    set:
      ingress.enabled: true
      ingress.hosts:
        - host: api.example.com
          paths:
            - path: /
              pathType: Prefix
    asserts:
      - equal:
          path: spec.rules[0].host
          value: api.example.com
      - equal:
          path: spec.rules[0].http.paths[0].path
          value: /
      - equal:
          path: spec.rules[0].http.paths[0].pathType
          value: Prefix

  # Test 7: Ingress TLS
  - it: should configure TLS correctly
    set:
      ingress.enabled: true
      ingress.tls:
        - secretName: api-tls
          hosts:
            - api.example.com
    asserts:
      - equal:
          path: spec.tls[0].secretName
          value: api-tls
      - contains:
          path: spec.tls[0].hosts
          content: api.example.com

  # Test 8: Multiple hosts
  - it: should support multiple hosts
    set:
      ingress.enabled: true
      ingress.hosts:
        - host: api.example.com
          paths:
            - path: /
              pathType: Prefix
        - host: api2.example.com
          paths:
            - path: /v2
              pathType: Prefix
    asserts:
      - equal:
          path: spec.rules[0].host
          value: api.example.com
      - equal:
          path: spec.rules[1].host
          value: api2.example.com
      - equal:
          path: spec.rules[1].http.paths[0].path
          value: /v2

  # Test 9: Backend service reference
  - it: should reference correct backend service
    set:
      ingress.enabled: true
      ingress.hosts:
        - host: api.example.com
          paths:
            - path: /
              pathType: Prefix
      service.port: 8000
    asserts:
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: RELEASE-NAME-task-api
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.port.number
          value: 8000
