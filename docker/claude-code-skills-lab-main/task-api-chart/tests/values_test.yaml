# Helm Unittest Tests for Values Validation

suite: test values
templates:
  - deployment.yaml
  - service.yaml
tests:
  # Test 1: Default values
  - it: should work with default values
    asserts:
      - isKind:
          of: Deployment

  # Test 2: Development environment
  - it: should apply development configuration
    values:
      - ../values-dev.yaml
    asserts:
      - equal:
          path: spec.replicas
          value: 1
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: ".*:latest$"

  # Test 3: Staging environment
  - it: should apply staging configuration
    values:
      - ../values-staging.yaml
    asserts:
      - equal:
          path: spec.replicas
          value: 2

  # Test 4: Production environment
  - it: should apply production configuration
    values:
      - ../values-prod.yaml
    asserts:
      - equal:
          path: spec.replicas
          value: 5
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: ".*:v[0-9]+\\.[0-9]+\\.[0-9]+$"

  # Test 5: Required fields validation
  - it: should require image repository
    set:
      image.repository: null
    asserts:
      - failedTemplate:
          errorMessage: "image.repository is required"

  # Test 6: Valid replica count range
  - it: should accept valid replica count
    set:
      replicaCount: 5
      autoscaling.enabled: false
    asserts:
      - equal:
          path: spec.replicas
          value: 5

  # Test 7: Image pull policy validation
  - it: should accept valid pull policies
    set:
      image.pullPolicy: Always
    asserts:
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: Always

  - it: should accept IfNotPresent pull policy
    set:
      image.pullPolicy: IfNotPresent
    asserts:
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: IfNotPresent

  # Test 8: Service type validation
  - it: should accept valid service types
    template: service.yaml
    set:
      service.type: ClusterIP
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP

  - it: should accept LoadBalancer type
    template: service.yaml
    set:
      service.type: LoadBalancer
    asserts:
      - equal:
          path: spec.type
          value: LoadBalancer

  # Test 9: Port range validation
  - it: should accept valid port
    template: service.yaml
    set:
      service.port: 8080
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 8080

  # Test 10: Resource limits format
  - it: should accept valid resource formats
    set:
      resources:
        limits:
          cpu: "1000m"
          memory: "1Gi"
        requests:
          cpu: "500m"
          memory: "512Mi"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: "1000m"
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: "1Gi"

  # Test 11: Environment variables validation
  - it: should accept environment variables
    set:
      env:
        - name: LOG_LEVEL
          value: "DEBUG"
        - name: API_TIMEOUT
          value: "30"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LOG_LEVEL
            value: "DEBUG"

  # Test 12: Security contexts
  - it: should apply production security context
    values:
      - ../values-prod.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
