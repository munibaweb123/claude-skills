# Helm Unittest Tests for Helper Templates

suite: test helpers
templates:
  - deployment.yaml  # Use deployment to test helpers
tests:
  # Test 1: fullname helper
  - it: should generate correct fullname
    release:
      name: myrelease
    asserts:
      - equal:
          path: metadata.name
          value: myrelease-task-api

  - it: should use fullnameOverride when set
    set:
      fullnameOverride: custom-name
    asserts:
      - equal:
          path: metadata.name
          value: custom-name

  # Test 2: chart label
  - it: should include chart label
    chart:
      version: 1.2.3
    asserts:
      - equal:
          path: metadata.labels["helm.sh/chart"]
          value: task-api-1.2.3

  # Test 3: selector labels
  - it: should have correct selector labels
    release:
      name: test-release
    asserts:
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: task-api
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/instance"]
          value: test-release

  # Test 4: image helper
  - it: should construct image string correctly
    set:
      image.repository: myrepo/myapp
      image.tag: v1.0.0
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: myrepo/myapp:v1.0.0

  - it: should use Chart.AppVersion when tag not specified
    set:
      image.repository: myrepo/myapp
      image.tag: ""
    chart:
      appVersion: 2.0.0
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: "myrepo/myapp:2.0.0"

  # Test 5: environment-specific replicas
  - it: should set replicas for development
    set:
      environment: development
      replicaCount: 1
      autoscaling.enabled: false
    asserts:
      - equal:
          path: spec.replicas
          value: 1

  - it: should set replicas for production
    set:
      environment: production
      replicaCount: 5
      autoscaling.enabled: false
    asserts:
      - equal:
          path: spec.replicas
          value: 5

  # Test 6: PostgreSQL connection helpers
  - it: should use internal PostgreSQL when enabled
    set:
      postgresql.enabled: true
    release:
      name: test
    templates:
      - deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      # PostgreSQL helpers are used in env vars

  # Test 7: Service account name
  - it: should generate service account name
    set:
      serviceAccount.create: true
      serviceAccount.name: ""
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-task-api

  - it: should use custom service account name
    set:
      serviceAccount.create: true
      serviceAccount.name: "custom-sa"
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: custom-sa
