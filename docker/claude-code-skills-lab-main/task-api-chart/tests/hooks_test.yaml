# Helm Unittest Tests for Hooks

suite: test hooks
templates:
  - pre-upgrade-migration.yaml
  - post-upgrade-test.yaml
  - pre-delete-backup.yaml
  - test-connection.yaml
tests:
  # Test 1: Pre-upgrade migration hook
  - it: should create migration job with correct annotations
    template: pre-upgrade-migration.yaml
    asserts:
      - isKind:
          of: Job
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-upgrade,pre-install
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-5"
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation,hook-succeeded

  - it: migration job should have correct configuration
    template: pre-upgrade-migration.yaml
    asserts:
      - equal:
          path: spec.backoffLimit
          value: 0
      - equal:
          path: spec.ttlSecondsAfterFinished
          value: 300
      - equal:
          path: spec.template.spec.restartPolicy
          value: Never

  - it: migration should include init container for db wait
    template: pre-upgrade-migration.yaml
    asserts:
      - isNotNull:
          path: spec.template.spec.initContainers
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: wait-for-db

  # Test 2: Post-upgrade health check hook
  - it: should create health check job with correct annotations
    template: post-upgrade-test.yaml
    asserts:
      - isKind:
          of: Job
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: post-upgrade,post-install
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "5"
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation,hook-succeeded

  - it: health check should have retries
    template: post-upgrade-test.yaml
    asserts:
      - equal:
          path: spec.backoffLimit
          value: 3
      - equal:
          path: spec.activeDeadlineSeconds
          value: 300

  # Test 3: Pre-delete backup hook
  - it: should create backup job when PostgreSQL is enabled
    template: pre-delete-backup.yaml
    set:
      postgresql.enabled: true
    asserts:
      - isKind:
          of: Job
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-delete
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-5"
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: hook-succeeded

  - it: should not create backup when PostgreSQL is disabled
    template: pre-delete-backup.yaml
    set:
      postgresql.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: backup should have timeout configured
    template: pre-delete-backup.yaml
    set:
      postgresql.enabled: true
    asserts:
      - equal:
          path: spec.activeDeadlineSeconds
          value: 1800
      - equal:
          path: spec.backoffLimit
          value: 2

  # Test 4: Test connection hook
  - it: should create test pod with correct annotations
    template: test-connection.yaml
    asserts:
      - isKind:
          of: Pod
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: test
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: hook-succeeded

  - it: test pod should never restart
    template: test-connection.yaml
    asserts:
      - equal:
          path: spec.restartPolicy
          value: Never

  # Test 5: Hook naming includes revision
  - it: migration name should include revision
    template: pre-upgrade-migration.yaml
    release:
      revision: 5
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: ".*-db-migrate-5$"

  - it: health check name should include revision
    template: post-upgrade-test.yaml
    release:
      revision: 10
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: ".*-health-check-10$"

  # Test 6: Component labels
  - it: hooks should have correct component labels
    template: pre-upgrade-migration.yaml
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: migration

  - it: health check should have correct component label
    template: post-upgrade-test.yaml
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: health-check

  - it: backup should have correct component label
    template: pre-delete-backup.yaml
    set:
      postgresql.enabled: true
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: backup
