# Helm Unittest Tests for Service

suite: test service
templates:
  - service.yaml
tests:
  # Test 1: Service metadata
  - it: should have correct name and labels
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: RELEASE-NAME-task-api
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: task-api

  # Test 2: Service type
  - it: should default to ClusterIP
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP

  - it: should support LoadBalancer type
    set:
      service.type: LoadBalancer
    asserts:
      - equal:
          path: spec.type
          value: LoadBalancer

  - it: should support NodePort type
    set:
      service.type: NodePort
      service.nodePort: 30080
    asserts:
      - equal:
          path: spec.type
          value: NodePort

  # Test 3: Service ports
  - it: should expose correct port
    set:
      service.port: 8080
      service.targetPort: 8080
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 8080
      - equal:
          path: spec.ports[0].targetPort
          value: 8080
      - equal:
          path: spec.ports[0].protocol
          value: TCP

  # Test 4: Selector labels
  - it: should have correct selector labels
    asserts:
      - equal:
          path: spec.selector["app.kubernetes.io/name"]
          value: task-api
      - equal:
          path: spec.selector["app.kubernetes.io/instance"]
          value: RELEASE-NAME

  # Test 5: Service annotations
  - it: should include custom annotations
    set:
      service.annotations:
        service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
        external-dns.alpha.kubernetes.io/hostname: "api.example.com"
    asserts:
      - equal:
          path: metadata.annotations["service.beta.kubernetes.io/aws-load-balancer-type"]
          value: "nlb"
      - equal:
          path: metadata.annotations["external-dns.alpha.kubernetes.io/hostname"]
          value: "api.example.com"

  # Test 6: NodePort configuration
  - it: should set nodePort when type is NodePort
    set:
      service.type: NodePort
      service.nodePort: 30100
    asserts:
      - equal:
          path: spec.type
          value: NodePort
      - equal:
          path: spec.ports[0].nodePort
          value: 30100

  # Test 7: LoadBalancer IP
  - it: should set loadBalancerIP when specified
    set:
      service.type: LoadBalancer
      service.loadBalancerIP: "10.0.0.100"
    asserts:
      - equal:
          path: spec.loadBalancerIP
          value: "10.0.0.100"
