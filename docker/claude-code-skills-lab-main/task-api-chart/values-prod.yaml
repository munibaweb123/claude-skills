# =============================================================================
# PRODUCTION ENVIRONMENT VALUES
# =============================================================================
# Usage: helm install task-api ./task-api-chart -f values-prod.yaml -n prod --atomic --wait
#
# Production requirements:
# - High availability (multiple replicas)
# - Pinned image versions (NEVER use 'latest')
# - Full security hardening
# - Resource limits enforced
# - Strict health checks
# - Horizontal autoscaling enabled
# - Anti-affinity rules for resilience
# =============================================================================

# Environment identifier
environment: "production"

# Higher replica count for HA (HPA will override if enabled)
replicaCount: 5

# Image configuration - ALWAYS pin to specific versions in production
image:
  repository: your-registry/task-api
  pullPolicy: IfNotPresent  # Don't pull if already present
  tag: "v1.0.0"  # ALWAYS use specific version tags, NEVER 'latest'

imagePullSecrets:
  - name: registry-secret

# Production resources - generous limits
resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m      # Ensure stable baseline
    memory: 512Mi

# Production environment variables - minimal logging
env:
  - name: DATABASE_URL
    value: "postgresql://prod-db.internal:5432/tasks_prod"
  - name: LOG_LEVEL
    value: "WARN"  # Less verbose in production
  - name: API_TIMEOUT
    value: "30"
  - name: ENABLE_METRICS
    value: "true"
  - name: ENABLE_TRACING
    value: "true"
  - name: CACHE_ENABLED
    value: "true"
  - name: CACHE_TTL
    value: "600"
  - name: MAX_CONNECTIONS
    value: "100"

# Strict health checks for production
livenessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: 8000
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# Horizontal autoscaling enabled in production
autoscaling:
  enabled: true
  minReplicas: 3      # Never go below 3 for HA
  maxReplicas: 20     # Scale up to handle spikes
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Ingress enabled with production domain
ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
  hosts:
    - host: api.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: task-api-prod-tls
      hosts:
        - api.example.com

podAnnotations:
  environment: "production"
  prometheus.io/scrape: "true"
  prometheus.io/port: "8000"

# Production security context - strict hardening
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop:
      - ALL

# Volumes for read-only root filesystem
volumes:
  - name: tmp
    emptyDir: {}
  - name: cache
    emptyDir: {}

volumeMounts:
  - name: tmp
    mountPath: /tmp
  - name: cache
    mountPath: /app/cache

# Production node selector
nodeSelector:
  workload: production

# Strong anti-affinity for high availability
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - task-api
          topologyKey: topology.kubernetes.io/zone
      - weight: 50
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - task-api
          topologyKey: kubernetes.io/hostname

# =============================================================================
# DEPENDENCIES - PRODUCTION
# =============================================================================

# PostgreSQL - Use external managed database in production
# Set enabled: false and configure externalDatabase below
postgresql:
  enabled: false  # Disable internal PostgreSQL in production

# External managed PostgreSQL (e.g., AWS RDS, Azure Database, Google Cloud SQL)
externalDatabase:
  host: "prod-postgres.cluster-xyz.us-east-1.rds.amazonaws.com"
  port: 5432
  username: "taskapi_prod"
  password: ""  # Set via secret or --set flag
  database: "tasks_prod"

# Redis - Use external managed Redis in production
# Set enabled: false and configure externalRedis below
redis:
  enabled: false  # Disable internal Redis in production

# External managed Redis (e.g., AWS ElastiCache, Azure Cache, Google Memorystore)
externalRedis:
  host: "prod-redis.cluster-xyz.cache.amazonaws.com"
  port: 6379
  password: ""  # Set via secret or --set flag
