# =============================================================================
# STAGING ENVIRONMENT VALUES
# =============================================================================
# Usage: helm install task-api ./task-api-chart -f values-staging.yaml -n staging
#
# Staging characteristics:
# - Production-like configuration
# - Reduced scale for cost efficiency
# - Full observability enabled
# - Latest stable images for testing
# =============================================================================

# Environment identifier
environment: "staging"

# Two replicas for basic HA testing
replicaCount: 2

# Image configuration - test latest stable builds
image:
  repository: your-registry/task-api
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: registry-secret

# Moderate resources - production-like but smaller
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

# Staging environment variables - moderate logging
env:
  - name: DATABASE_URL
    value: "postgresql://staging-db.internal:5432/tasks_staging"
  - name: LOG_LEVEL
    value: "INFO"
  - name: API_TIMEOUT
    value: "30"
  - name: ENABLE_METRICS
    value: "true"
  - name: ENABLE_TRACING
    value: "true"
  - name: CACHE_ENABLED
    value: "true"
  - name: CACHE_TTL
    value: "300"

# Standard health checks
livenessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: 8000
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# Autoscaling disabled - fixed replicas in staging
autoscaling:
  enabled: false

# Ingress enabled for staging
ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-staging"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: task-api-staging.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: task-api-staging-tls
      hosts:
        - task-api-staging.example.com

podAnnotations:
  environment: "staging"
  prometheus.io/scrape: "true"
  prometheus.io/port: "8000"

# Standard security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# Basic anti-affinity for pod spreading
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 50
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - task-api
          topologyKey: kubernetes.io/hostname

# =============================================================================
# DEPENDENCIES - STAGING
# =============================================================================

# PostgreSQL - enabled with moderate resources
postgresql:
  enabled: true
  auth:
    username: taskapi_staging
    password: stagingpass456
    database: tasks_staging
  primary:
    persistence:
      enabled: true
      size: 5Gi
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 250m
        memory: 256Mi

# Redis - enabled with auth
redis:
  enabled: true
  auth:
    enabled: true
    password: stagingredis789
  master:
    persistence:
      enabled: false  # Volatile cache
    resources:
      limits:
        cpu: 250m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
