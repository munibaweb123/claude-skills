{{- if not .Values.redis.enabled -}}
{{- if .Values.externalRedis.password -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "task-api-chart.fullname" . }}-external-redis
  labels:
    {{- include "task-api-chart.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ .Values.externalRedis.password | b64enc | quote }}
{{- end }}
{{- end }}
