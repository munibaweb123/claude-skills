{{- if not .Values.postgresql.enabled -}}
{{- if .Values.externalDatabase.password -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "task-api-chart.fullname" . }}-external-db
  labels:
    {{- include "task-api-chart.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ .Values.externalDatabase.password | b64enc | quote }}
{{- end }}
{{- end }}
