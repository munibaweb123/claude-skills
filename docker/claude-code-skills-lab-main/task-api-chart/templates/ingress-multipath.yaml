{{/*
Complex Ingress with multi-path routing, multiple backends, rate limiting,
CORS, and advanced nginx annotations.

Supports:
- Multiple hosts with different path configurations
- Per-path backend service routing (different services per path)
- Rate limiting per path
- CORS configuration
- SSL redirect and HSTS
- Canary deployments
- Custom error pages
- Path rewriting
- Websocket support
*/}}
{{- if .Values.ingress.enabled -}}
{{- $fullName := include "task-api-chart.fullname" . -}}
{{- $svcPort := .Values.service.port -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "task-api-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingress
  annotations:
    # ---- SSL / TLS ----
    {{- if .Values.ingress.forceSSL }}
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    {{- end }}
    {{- if .Values.ingress.hsts }}
    nginx.ingress.kubernetes.io/hsts: "true"
    nginx.ingress.kubernetes.io/hsts-max-age: {{ .Values.ingress.hstsMaxAge | default "31536000" | quote }}
    nginx.ingress.kubernetes.io/hsts-include-subdomains: "true"
    nginx.ingress.kubernetes.io/hsts-preload: "true"
    {{- end }}

    # ---- Rate Limiting ----
    {{- if .Values.ingress.rateLimit }}
    {{- with .Values.ingress.rateLimit }}
    nginx.ingress.kubernetes.io/limit-rps: {{ .rps | default "10" | quote }}
    nginx.ingress.kubernetes.io/limit-rpm: {{ .rpm | default "300" | quote }}
    nginx.ingress.kubernetes.io/limit-burst-multiplier: {{ .burstMultiplier | default "5" | quote }}
    nginx.ingress.kubernetes.io/limit-connections: {{ .connections | default "10" | quote }}
    {{- end }}
    {{- end }}

    # ---- CORS ----
    {{- if .Values.ingress.cors }}
    {{- with .Values.ingress.cors }}
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: {{ .allowOrigin | default "*" | quote }}
    nginx.ingress.kubernetes.io/cors-allow-methods: {{ .allowMethods | default "GET, POST, PUT, DELETE, OPTIONS" | quote }}
    nginx.ingress.kubernetes.io/cors-allow-headers: {{ .allowHeaders | default "Authorization, Content-Type, Accept" | quote }}
    nginx.ingress.kubernetes.io/cors-max-age: {{ .maxAge | default "3600" | quote }}
    nginx.ingress.kubernetes.io/cors-allow-credentials: {{ .allowCredentials | default "true" | quote }}
    {{- end }}
    {{- end }}

    # ---- Body Size / Timeouts ----
    {{- if .Values.ingress.bodySize }}
    nginx.ingress.kubernetes.io/proxy-body-size: {{ .Values.ingress.bodySize | quote }}
    {{- end }}
    {{- if .Values.ingress.timeouts }}
    {{- with .Values.ingress.timeouts }}
    nginx.ingress.kubernetes.io/proxy-connect-timeout: {{ .connect | default "60" | quote }}
    nginx.ingress.kubernetes.io/proxy-send-timeout: {{ .send | default "60" | quote }}
    nginx.ingress.kubernetes.io/proxy-read-timeout: {{ .read | default "60" | quote }}
    {{- end }}
    {{- end }}

    # ---- Websocket Support ----
    {{- if .Values.ingress.websocket }}
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/upstream-hash-by: "$the_real_ip"
    {{- end }}

    # ---- Custom Error Pages ----
    {{- if .Values.ingress.customErrors }}
    {{- with .Values.ingress.customErrors }}
    nginx.ingress.kubernetes.io/custom-http-errors: {{ .codes | quote }}
    nginx.ingress.kubernetes.io/default-backend: {{ .backend | quote }}
    {{- end }}
    {{- end }}

    # ---- Security Headers ----
    {{- if .Values.ingress.securityHeaders }}
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "Content-Security-Policy: default-src 'self'";
      more_set_headers "Permissions-Policy: camera=(), microphone=(), geolocation=()";
    {{- end }}

    # ---- Additional Custom Annotations ----
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}

  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}

  {{- if .Values.ingress.defaultBackend }}
  defaultBackend:
    service:
      name: {{ .Values.ingress.defaultBackend.serviceName | default $fullName }}
      port:
        number: {{ .Values.ingress.defaultBackend.servicePort | default $svcPort }}
  {{- end }}

  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                {{- if .serviceName }}
                # Multi-path: route to different backend service
                name: {{ .serviceName }}
                port:
                  number: {{ .servicePort }}
                {{- else }}
                # Default: route to chart's own service
                name: {{ $fullName }}
                port:
                  number: {{ $svcPort }}
                {{- end }}
          {{- end }}
    {{- end }}
{{- end }}
---
{{/*
Canary Ingress for gradual traffic shifting during deployments.
Only created when ingress.canary is enabled.
*/}}
{{- if and .Values.ingress.enabled .Values.ingress.canary -}}
{{- if .Values.ingress.canary.enabled -}}
{{- $fullName := include "task-api-chart.fullname" . -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}-canary
  labels:
    {{- include "task-api-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingress-canary
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    {{- if .Values.ingress.canary.weight }}
    nginx.ingress.kubernetes.io/canary-weight: {{ .Values.ingress.canary.weight | quote }}
    {{- end }}
    {{- if .Values.ingress.canary.header }}
    nginx.ingress.kubernetes.io/canary-by-header: {{ .Values.ingress.canary.header | quote }}
    nginx.ingress.kubernetes.io/canary-by-header-value: {{ .Values.ingress.canary.headerValue | default "always" | quote }}
    {{- end }}
    {{- if .Values.ingress.canary.cookie }}
    nginx.ingress.kubernetes.io/canary-by-cookie: {{ .Values.ingress.canary.cookie | quote }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ $fullName }}-canary
                port:
                  number: {{ $.Values.ingress.canary.servicePort | default $.Values.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
{{- end }}
